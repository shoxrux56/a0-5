<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruscha o‘rganamiz</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#4B4B4B;--mut:#AFAFAF;--line:#E5E5E5;--g:#58CC02;--gd:#58A700;--b:#1CB0F6;--bd:#1899D6;--r:#FF4B4B;--rd:#EA2B2B;--y:#FFC800;--yd:#E5B400;--o:#FF9600;--lk:#E5E5E5;--lkd:#CECECE;--okbg:#D7FFB8;--okfg:#58A700;--badbg:#FFDFE0;--badfg:#EA2B2B;--selbg:#DDF4FF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131F24;--card:#131F24;--ink:#DCE6EA;--mut:#6B7F89;--line:#37464F;--lk:#37464F;--lkd:#2B3A42;--okbg:#1E3A10;--badbg:#3F1D1F;--selbg:#12303F}}
:root[data-theme="dark"]{--bg:#131F24;--card:#131F24;--ink:#DCE6EA;--mut:#6B7F89;--line:#37464F;--lk:#37464F;--lkd:#2B3A42;--okbg:#1E3A10;--badbg:#3F1D1F;--selbg:#12303F}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:800}
#app{max-width:520px;margin:0 auto;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;--u:min(1px,.25vw)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.stats{display:flex;justify-content:space-between;padding:12px 18px;border-bottom:2px solid var(--line);font-size:18px;position:sticky;top:0;background:var(--bg);z-index:5}
.home{flex:1;overflow-y:auto;padding:0 16px 40px}
.unit{display:flex;justify-content:space-between;align-items:center;color:#fff;border-radius:16px;border-bottom:5px solid;padding:14px 16px;margin:16px 0 22px}
.unit small{opacity:.85;font-size:13px;display:block}.unit b{font-size:21px;display:block}.unit span{font-size:15px;opacity:.95}
.nw{display:flex;justify-content:center;margin-bottom:18px;position:relative}
.node{width:76px;height:70px;border-radius:50%;border:0;border-bottom:8px solid;font-size:30px;display:grid;place-items:center;color:#fff;position:relative}
.node:active{transform:translateY(5px);border-bottom-width:3px}
.node.lock{background:var(--lk);border-color:var(--lkd);color:var(--mut)}
.node.done{background:var(--y);border-color:var(--yd)}
.bub{position:absolute;top:-38px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-size:14px;color:var(--g);white-space:nowrap}
.bub:after{content:"";position:absolute;bottom:-7px;left:50%;width:10px;height:10px;background:var(--bg);border:solid var(--line);border-width:0 2px 2px 0;transform:translateX(-50%) rotate(45deg)}
.head{display:flex;align-items:center;gap:14px;padding:16px}
.x{background:none;border:0;font-size:26px;color:var(--mut);padding:0}
.bar{flex:1;height:16px;background:var(--line);border-radius:9px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g);border-radius:9px;transition:width .4s;position:relative}
.bar i:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;background:rgba(255,255,255,.35);border-radius:4px}
.q{flex:1;overflow-y:auto;padding:4px 20px 16px;display:flex;flex-direction:column;gap:16px}
.q h2{font-size:clamp(20px,6vw,25px);margin:0;font-weight:900}
.mas{display:flex;align-items:center;gap:10px}.mas .em{font-size:68px;line-height:1}
.say{position:relative;border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:22px}
.say:before{content:"";position:absolute;left:-8px;top:50%;width:12px;height:12px;background:var(--bg);border:solid var(--line);border-width:0 0 2px 2px;transform:translateY(-50%) rotate(45deg)}
.spk{background:none;border:0;font-size:26px;padding:0}
.big{width:110px;height:110px;border-radius:24px;background:var(--b);border:0;border-bottom:6px solid var(--bd);font-size:48px;margin:10px auto}
.slow{width:60px;height:56px;border-radius:16px;background:var(--b);border:0;border-bottom:5px solid var(--bd);font-size:26px;margin:0 auto}
.opts{display:grid;gap:10px}
.opt,.tile{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;font-size:18px;text-align:left}
.opt.sel,.tile.sel{border-color:var(--b);background:var(--selbg);color:var(--b)}
.opt.ok,.tile.ok{border-color:var(--g);background:var(--okbg);color:var(--okfg);opacity:.7}
.opt.no,.tile.no{border-color:var(--r);background:var(--badbg);color:var(--badfg)}
.ans,.bank{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:64px;padding:8px 0}
.ans{border-top:2px solid var(--line);border-bottom:2px solid var(--line);min-height:76px}
.tile{padding:10px 14px;font-size:20px;text-align:center}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt>div{display:grid;gap:10px;align-content:start}
.foot{border-top:2px solid var(--line);padding:16px 20px 20px}
.foot.ok{background:var(--okbg);border-color:transparent;color:var(--okfg)}.foot.bad{background:var(--badbg);border-color:transparent;color:var(--badfg)}
.foot h3{margin:0 0 4px;font-size:22px;font-weight:900}.foot p{margin:0 0 14px;font-size:16px}
.btn{width:100%;background:var(--g);color:#fff;border:0;border-bottom:5px solid var(--gd);border-radius:16px;padding:14px;font-size:17px;letter-spacing:.5px;text-transform:uppercase}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:var(--lk);border-color:var(--lkd);color:var(--mut);cursor:default}
.foot.bad .btn{background:var(--r);border-color:var(--rd)}
.btn.ghost{background:var(--card);color:var(--b);border:2px solid var(--line);border-bottom-width:5px}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
.end .em{font-size:100px}.end h1{font-size:30px;margin:0;color:var(--y)}
.cards{display:flex;gap:10px;margin:16px 0}
.cd{border:2px solid;border-radius:16px;min-width:96px;overflow:hidden}.cd small{display:block;color:#fff;padding:4px 8px;font-size:13px}.cd b{display:block;padding:12px 8px;font-size:22px}
@media(min-width:600px){#app{border-left:2px solid var(--line);border-right:2px solid var(--line)}}
@media(max-width:380px){.mas .em{font-size:50px}.say{font-size:18px;padding:8px 10px}.opt{font-size:16px;padding:12px}.tile{font-size:17px;padding:9px 11px}.cd{min-width:0;flex:1}.cd b{font-size:17px}.unit b{font-size:18px}.node{width:66px;height:60px;font-size:26px}.cards{gap:6px}.foot h3{font-size:19px}.stats{padding:10px 12px;font-size:16px}}
@media(max-height:620px){.big{width:76px;height:76px;font-size:32px;margin:0 auto}.end .em{font-size:60px}.q{gap:10px}.mas .em{font-size:48px}.foot{padding:10px 16px 14px}}
@media(prefers-reduced-motion:no-preference){.bub{animation:bob 1s infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.pop{animation:pp .6s}@keyframes pp{50%{transform:scale(1.3) rotate(-8deg)}}}
</style></head><body><div id="app"></div>
<script>
const UNITS=[
{t:"Fe‘llar",d:"Harakat va kundalik ishlar",c:"#58CC02",cd:"#58A700",n:[0,5,10],items:[["идти","piyoda borish"],["ехать","transportda borish"],["кушать / есть","yeyish"],["пить","ichish"],["работать","ishlash"],["учиться","o‘qish"],["спать","uxlash"],["отдыхать","dam olish"],["смотреть","ko‘rish"],["слушать","eshitish"]]},
{t:"Sifatlar",d:"Katta, kichik, issiq, sovuq…",c:"#1CB0F6",cd:"#1899D6",n:[0,5,10],items:[["большой","katta"],["маленький","kichik"],["хороший","yaxshi"],["плохой","yomon"],["дорогой","qimmat"],["дешёвый","arzon"],["вкусный","mazali"],["невкусный","bemazza"],["горячий","issiq"],["холодный","sovuq"]]},
{t:"Iboralar",d:"Holat va his-tuyg‘ular",c:"#CE82FF",cd:"#A560D6",n:[0,6],build:1,items:[["Я устал / Я устала","Men charchadim"],["Я болен / Я больна","Men kasalman"],["Мне интересно","Menga qiziq"],["Мне трудно","Menga qiyin"],["Мне легко","Menga oson"],["Мне хорошо","Menga yaxshi"]]}];
const ALL=UNITS.flatMap(u=>u.items);
const NODES=[];UNITS.forEach((u,ui)=>{for(let k=0;k<u.n.length-1;k++)NODES.push({id:"n"+NODES.length,ui,it:u.items.slice(u.n[k],u.n[k+1]),pool:u.items,build:u.build,e:"⭐"})});
NODES.push({id:"nx",ui:0,mix:1,pool:ALL,e:"🏆"});
const $=s=>document.querySelector(s),app=$("#app");
let S={xp:0,streak:0,last:"",done:{}};try{Object.assign(S,JSON.parse(localStorage.getItem("duo-ru")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("duo-ru",JSON.stringify(S))}catch(e){}};
const sh=a=>{a=a.slice();for(let i=a.length;i>1;i--){const j=Math.random()*i|0;[a[i-1],a[j]]=[a[j],a[i-1]]}return a};
const f1=r=>r.split(" / ")[0];
let ac;const beep=(f,d=.12)=>{try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};
const say=(t,r=.85)=>{try{const u=new SpeechSynthesisUtterance(f1(t));u.lang="ru-RU";u.rate=r;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const OFF=[0,40,66,40,0,-40,-66,-40];
function home(){
const cur=NODES.findIndex(n=>!S.done[n.id]);let gi=0,html="";
UNITS.forEach((u,ui)=>{html+=`<div class="unit" style="background:${u.c};border-color:${u.cd}"><div><small>${ui+1}-BO‘LIM</small><b>${u.t}</b><span>${u.d}</span></div><span style="font-size:30px">📖</span></div>`;
NODES.forEach((n,i)=>{if(n.ui!==ui||n.mix)return;html+=nodeH(n,i,cur,gi++,u)})});
const m=NODES.length-1;html+=`<div class="unit" style="background:#FF9600;border-color:#E58700"><div><small>FINAL</small><b>Aralash jang</b><span>Hammasini takrorlang</span></div><span style="font-size:30px">🔥</span></div>`+nodeH(NODES[m],m,cur,gi,{c:"#FF9600",cd:"#E58700"});
app.innerHTML=`<div class="stats"><span>🇷🇺</span><span style="color:var(--o)">🔥 ${S.streak}</span><span style="color:var(--b)">💎 ${S.xp}</span><span style="color:var(--r)">❤️ 5</span></div><div class="home">${html}</div>`;
app.querySelectorAll(".node").forEach(b=>b.onclick=()=>{const n=NODES[b.dataset.i];if(b.classList.contains("lock")){b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),400);beep(180)}else start(n)});
const c=$(".node:not(.lock):not(.done)");if(c)c.scrollIntoView({block:"center"})}
function nodeH(n,i,cur,g,u){const st=S.done[n.id]?"done":i===cur?"cur":(i<cur?"done":"lock");
const sty=st==="cur"?`background:${u.c};border-color:${u.cd}`:"";
return `<div class="nw" style="transform:translateX(calc(${OFF[g%8]} * var(--u)))">${st==="cur"?'<span class="bub">BOSHLASH</span>':""}<button class="node ${st==="cur"?"":st}" data-i="${i}" style="${sty}" aria-label="Dars ${i+1}">${st==="lock"?"🔒":st==="done"?"✓":n.e}</button></div>`}
let G;
function start(n){
const items=n.mix?sh(ALL).slice(0,6):n.it;
let q=sh(items).map(i=>({k:"ru2uz",i,pool:n.pool}));
q.push({k:"match",items});
sh(items).forEach((i,x)=>{const ks=["uz2ru","listen","ru2uz"];if(n.build)ks.push("build","build");q.push({k:ks[Math.random()*ks.length|0],i,pool:n.pool})});
G={n,q,tot:q.length,done:0,hearts:5,ok:0,miss:0,t0:Date.now(),streak:0};show()}
const head=()=>`<div class="head"><button class="x" id="quit" aria-label="Chiqish">✕</button><div class="bar"><i style="width:${G.done/G.tot*100}%"></i></div><span style="color:var(--r)">❤️ <span id="hr">${G.hearts}</span></span></div>`;
function show(){
if(G.hearts<=0)return end(false);if(!G.q.length)return end(true);
const q=G.q[0];app.innerHTML=head()+`<div class="q" id="q"></div><div class="foot" id="foot"><button class="btn" id="chk" disabled>Tekshirish</button></div>`;
$("#quit").onclick=home;
const Q=$("#q");q.get=null;
if(q.k==="match")return matchQ(q,Q);
if(q.k==="build"){const ans=f1(q.i[0]).split(" ");const ex=sh(ALL.flatMap(a=>f1(a[0]).split(" "))).filter(w=>!ans.includes(w)).slice(0,2);
q.tok=sh(ans.concat([...new Set(ex)]));q.sel=[];q.ans=ans.join(" ");
Q.innerHTML=`<h2>Ruscha yozing</h2><div class="mas"><span class="em">🐫</span><div class="say">${q.i[1]}</div></div><div class="ans" id="ans"></div><div class="bank" id="bank"></div>`;tiles(q);q.get=()=>q.sel.join(" ");q.cor=q.ans;return arm(q)}
const fw=q.k!=="uz2ru",cor=q.k==="uz2ru"?q.i[0]:q.i[1];q.cor=cor;
const wr=sh(q.pool.filter(a=>a!==q.i)).slice(0,3).map(a=>q.k==="uz2ru"?a[0]:a[1]);
let top;
if(q.k==="listen")top=`<h2>Eshiting va tarjimasini tanlang</h2><button class="big" id="sp" aria-label="Eshitish">🔊</button><button class="slow" id="sl" aria-label="Sekin">🐢</button>`;
else if(q.k==="ru2uz")top=`<h2>Bu so‘z nimani anglatadi?</h2><div class="mas"><span class="em">🐫</span><div class="say"><button class="spk" id="sp" aria-label="Eshitish">🔊</button><span style="border-bottom:2px dotted var(--mut)">${q.i[0]}</span></div></div>`;
else top=`<h2>Ruscha qanday aytiladi?</h2><div class="mas"><span class="em">🐫</span><div class="say">${q.i[1]}</div></div>`;
Q.innerHTML=top+`<div class="opts">${sh([cor,...wr]).map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}</div>`;
let p=null;Q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{Q.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");p=b.dataset.o;$("#chk").disabled=false;if(q.k==="uz2ru")say(p)});
q.get=()=>p;if($("#sp")){$("#sp").onclick=()=>say(q.i[0]);say(q.i[0])}if($("#sl"))$("#sl").onclick=()=>say(q.i[0],.5);arm(q)}
function arm(q){$("#chk").onclick=()=>{const good=q.get()===q.cor;Q_lock();result(good,q.cor)}}
const Q_lock=()=>app.querySelectorAll("#q .opt,#q .tile").forEach(b=>b.disabled=true);
function tiles(q){const A=$("#ans"),B=$("#bank");
A.innerHTML=q.sel.map((w,i)=>`<button class="tile" data-a="${i}">${w}</button>`).join("");
const u=[...q.sel],rest=[];q.tok.forEach(w=>{const k=u.indexOf(w);k>-1?u.splice(k,1):rest.push(w)});
B.innerHTML=rest.map(w=>`<button class="tile" data-b="${w}">${w}</button>`).join("");
$("#chk").disabled=!q.sel.length;
A.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{q.sel.splice(+t.dataset.a,1);tiles(q)});
B.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{q.sel.push(t.dataset.b);say(t.dataset.b);tiles(q)})}
function matchQ(q,Q){
const L=q.items.map(i=>i[0]),R=sh(q.items.map(i=>i[1])),map={};q.items.forEach(i=>map[i[0]]=i[1]);
Q.innerHTML=`<h2>Juftlarni toping</h2><div class="mt"><div id="L">${sh(L).map(w=>`<button class="tile" data-s="L" data-v="${w}">${w}</button>`).join("")}</div><div>${R.map(w=>`<button class="tile" data-s="R" data-v="${w}">${w}</button>`).join("")}</div></div>`;
let sel=null,left=L.length;$("#chk").style.visibility="hidden";
Q.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
if(sel&&sel.dataset.s===b.dataset.s){sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
if(!sel){sel=b;b.classList.add("sel");if(b.dataset.s==="L")say(b.dataset.v);return}
const l=sel.dataset.s==="L"?sel:b,r=sel.dataset.s==="R"?sel:b,a=sel;sel=null;
if(map[l.dataset.v]===r.dataset.v){[l,r].forEach(x=>{x.classList.remove("sel");x.classList.add("ok");x.disabled=true});beep(740);say(l.dataset.v);if(--left===0)result(true,"",1)}
else{a.classList.remove("sel");[l,r].forEach(x=>x.classList.add("no"));G.hearts--;G.miss++;$("#hr").textContent=G.hearts;beep(180,.2);setTimeout(()=>{[l,r].forEach(x=>x.classList.remove("no"));if(G.hearts<=0)end(false)},450)}})}
function result(good,ans,noRequeue){
const q=G.q[0];beep(good?660:180,good?.12:.25);
if(good){G.ok++;G.done++;G.streak++;G.q.shift();if(good)beep(880,.15)}else{G.hearts--;G.miss++;G.streak=0;G.q.push(G.q.shift());$("#hr").textContent=G.hearts;app.classList.add("shake");setTimeout(()=>app.classList.remove("shake"),400)}
$(".bar i").style.width=G.done/G.tot*100+"%";
const pr=["Ajoyib!","Barakalla!","Zo‘r!","Mukammal!"][Math.random()*4|0];
const F=$("#foot");F.className="foot "+(good?"ok":"bad");
F.innerHTML=`<h3>${good?"✔ "+pr:"✖ Noto‘g‘ri"}</h3>${good?(G.streak>2?`<p>🔥 ${G.streak} ta ketma-ket!</p>`:"<p></p>"):`<p>To‘g‘ri javob:<br><b>${ans}</b></p>`}<button class="btn" id="nx">Davom etish</button>`;
$("#nx").focus();$("#nx").onclick=show}
function end(win){
const sec=Math.round((Date.now()-G.t0)/1000),acc=Math.round(G.ok/(G.ok+G.miss||1)*100);
if(win){const d=new Date().toDateString();if(S.last!==d){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=d}S.xp+=10+G.ok*2;S.done[G.n.id]=1;save()}
app.innerHTML=win?`<div class="end"><div class="em pop">🐫</div><h1>Dars tugadi!</h1><div class="cards"><div class="cd" style="border-color:var(--y)"><small style="background:var(--y)">JAMI XP</small><b style="color:var(--yd)">⚡ ${10+G.ok*2}</b></div><div class="cd" style="border-color:var(--g)"><small style="background:var(--g)">ANIQLIK</small><b style="color:var(--g)">🎯 ${acc}%</b></div><div class="cd" style="border-color:var(--b)"><small style="background:var(--b)">VAQT</small><b style="color:var(--b)">⏱ ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}</b></div></div><p style="color:var(--o);font-size:20px;margin:0">🔥 ${S.streak} kunlik seriya</p></div><div class="foot"><button class="btn" id="go">Davom etish</button></div>`
:`<div class="end"><div class="em">💔</div><h1 style="color:var(--r)">Jonlar tugadi!</h1><p>Xafa bo‘lmang, xatolardan o‘rganamiz.</p></div><div class="foot"><button class="btn" id="go">Qayta urinish</button><p></p><button class="btn ghost" id="hm">Chiqish</button></div>`;
$("#go").onclick=()=>win?home():start(G.n);if(!win)$("#hm").onclick=home;else beep(880,.3)}
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=$("#nx")||$("#chk");if(b&&!b.disabled&&b.style.visibility!=="hidden"&&document.activeElement!==b)b.click()}});
home();
</script></body></html>
