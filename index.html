<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruscha o‘rganamiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--card:#fff;--ink:#4B4B4B;--strong:#3C3C3C;--mut:#AFAFAF;--line:#E5E5E5;
  --g:#58CC02;--gd:#58A700;--b:#1CB0F6;--bd:#1899D6;--r:#FF4B4B;--rd:#EA2B2B;
  --y:#FFC800;--yd:#E5B400;--o:#FF9600;--lk:#E5E5E5;--lkd:#CECECE;
  --okbg:#D7FFB8;--okfg:#58A700;--badbg:#FFDFE0;--badfg:#EA2B2B;--selbg:#DDF4FF;
  --f:Nunito,"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131F24;--card:#1B2B32;--ink:#DCE6EA;--strong:#F1F7FB;--mut:#6B7F89;--line:#37464F;
  --lk:#37464F;--lkd:#2B3A42;--okbg:#1E3A10;--okfg:#89E219;--badbg:#3F1D1F;--badfg:#FF7878;--selbg:#12303F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131F24;--card:#1B2B32;--ink:#DCE6EA;--strong:#F1F7FB;--mut:#6B7F89;--line:#37464F;
  --lk:#37464F;--lkd:#2B3A42;--okbg:#1E3A10;--okfg:#89E219;--badbg:#3F1D1F;--badfg:#FF7878;--selbg:#12303F;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:800;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);--u:min(1px,.25vw)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}

/* Bosh sahifa */
.stats{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2px solid var(--line);font-size:clamp(16px,4.6vw,19px);background:var(--bg);flex:none}
.stats span{display:flex;align-items:center;gap:6px}
.stats .fl{width:30px;height:21px;border-radius:5px;border:2px solid var(--line);background:linear-gradient(#fff 0 33.3%,#1C57A5 33.3% 66.6%,#D52B1E 66.6%)}
.home{flex:1;overflow-y:auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px))}
.unit{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;border-radius:18px;border-bottom:5px solid;padding:14px 18px;margin:18px 0 26px}
.unit small{opacity:.85;font-size:13px;display:block;letter-spacing:.08em}
.unit b{font-size:clamp(18px,5.4vw,22px);display:block;margin:2px 0}
.unit span{font-size:15px;opacity:.95}
.unit .ic{font-size:34px;flex:none}
.nw{display:flex;justify-content:center;margin-bottom:20px;position:relative}
.node{width:78px;height:72px;border-radius:50%;border:0;border-bottom:8px solid;font-size:30px;display:grid;place-items:center;color:#fff;position:relative}
.node:active{transform:translateY(5px);border-bottom-width:3px}
.node.lock{background:var(--lk);border-color:var(--lkd);color:var(--mut)}
.node.done{background:var(--y);border-color:var(--yd)}
.bub{position:absolute;top:-40px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-size:14px;color:var(--g);white-space:nowrap;letter-spacing:.06em}
.bub:after{content:"";position:absolute;bottom:-7px;left:50%;width:10px;height:10px;background:var(--bg);border:solid var(--line);border-width:0 2px 2px 0;transform:translateX(-50%) rotate(45deg)}

/* Dars */
.head{display:flex;align-items:center;gap:14px;padding:16px 16px 8px;flex:none}
.x{background:none;border:0;font-size:26px;color:var(--mut);padding:0 4px;line-height:1}
.bar{flex:1;height:16px;background:var(--line);border-radius:9px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g);border-radius:9px;transition:width .4s;position:relative}
.bar i:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;background:rgba(255,255,255,.35);border-radius:4px}
.hr{color:var(--r);font-size:18px;white-space:nowrap}
.q{flex:1;min-height:0;overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;gap:18px}
.q h2{font-size:clamp(20px,6vw,25px);margin:0;font-weight:900;color:var(--strong);text-wrap:balance}
.mas{display:flex;align-items:center;gap:10px}
.mas .em{font-size:clamp(50px,16vw,68px);line-height:1;flex:none}
.say{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:clamp(18px,5.4vw,22px);color:var(--strong);overflow-wrap:anywhere;background:var(--card)}
.say:before{content:"";position:absolute;left:-8px;top:50%;width:12px;height:12px;background:var(--card);border:solid var(--line);border-width:0 0 2px 2px;transform:translateY(-50%) rotate(45deg)}
.spk{background:none;border:0;font-size:26px;padding:0;flex:none}
.big{width:clamp(76px,26vw,110px);height:clamp(76px,26vw,110px);border-radius:24px;background:var(--b);border:0;border-bottom:6px solid var(--bd);font-size:clamp(32px,11vw,48px);margin:6px auto;display:grid;place-items:center;flex:none}
.slow{width:60px;height:56px;border-radius:16px;background:var(--b);border:0;border-bottom:5px solid var(--bd);font-size:26px;margin:0 auto;display:grid;place-items:center;flex:none}
.big:active,.slow:active{transform:translateY(4px);border-bottom-width:2px}
.opts{display:grid;gap:10px}
.opt,.tile{background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;font-size:clamp(16px,4.8vw,18px);text-align:left;overflow-wrap:anywhere}
.opt:active:not(:disabled),.tile:active:not(:disabled){transform:translateY(2px);border-bottom-width:3px}
.opt.sel,.tile.sel{border-color:var(--b);background:var(--selbg);color:var(--b)}
.opt.ok,.tile.ok{border-color:var(--g);background:var(--okbg);color:var(--okfg);opacity:.7}
.opt.no,.tile.no{border-color:var(--r);background:var(--badbg);color:var(--badfg)}
.opt:disabled,.tile:disabled{cursor:default}
.ans,.bank{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:64px;padding:8px 0}
.ans{border-top:2px solid var(--line);border-bottom:2px solid var(--line);min-height:76px}
.bank{justify-content:center}
.tile{padding:10px 14px;font-size:clamp(17px,5vw,20px);text-align:center}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt>div{display:grid;gap:10px;align-content:start;min-width:0}
.mt .tile{padding:14px 8px;font-size:clamp(15px,4.4vw,18px)}

/* O'rgatish kartochkasi */
.learn{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin:auto 0}
.chipn{background:var(--selbg);color:var(--b);border-radius:999px;padding:6px 14px;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.card{width:100%;border:2px solid var(--line);border-bottom-width:6px;border-radius:24px;background:var(--card);padding:clamp(18px,6vw,30px) 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.lw{font-size:clamp(30px,10vw,44px);font-weight:900;line-height:1.15;overflow-wrap:anywhere;color:var(--strong)}
.lu{font-size:clamp(20px,6vw,26px);color:var(--b)}
.snd{display:flex;gap:12px;justify-content:center;align-items:center}
.snd .big,.snd .slow{margin:0}

.foot{border-top:2px solid var(--line);padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));flex:none;background:var(--bg)}
.foot.ok{background:var(--okbg);border-color:transparent;color:var(--okfg)}
.foot.bad{background:var(--badbg);border-color:transparent;color:var(--badfg)}
.foot h3{margin:0 0 4px;font-size:clamp(19px,5.6vw,22px);font-weight:900}
.foot p{margin:0 0 14px;font-size:16px}
.btn{width:100%;background:var(--g);color:#fff;border:0;border-bottom:5px solid var(--gd);border-radius:16px;padding:14px;font-size:17px;letter-spacing:.5px;text-transform:uppercase}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:var(--lk);border-color:var(--lkd);color:var(--mut);cursor:default}
.foot.bad .btn{background:var(--r);border-color:var(--rd)}
.btn.ghost{background:var(--card);color:var(--b);border:2px solid var(--line);border-bottom-width:5px}

/* Natija */
.end{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
.end .em{font-size:clamp(64px,22vw,100px);line-height:1}
.end h1{font-size:clamp(26px,8vw,32px);margin:0;color:var(--y)}
.cards{display:flex;gap:10px;margin:16px 0;width:100%;justify-content:center}
.cd{border:2px solid;border-radius:16px;flex:1;max-width:130px;min-width:0;overflow:hidden;background:var(--card)}
.cd small{display:block;color:#fff;padding:4px 6px;font-size:12px;letter-spacing:.06em}
.cd b{display:block;padding:12px 4px;font-size:clamp(16px,5vw,22px)}

/* Boshlash ekrani va xabarlar */
.end.st h1{color:var(--g)}
.end.st p{margin:0;font-size:17px;color:var(--ink);max-width:340px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;background:var(--strong);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:15px;z-index:9;display:none}
.toast.on{display:block}

@media(min-width:600px){#app{border-left:2px solid var(--line);border-right:2px solid var(--line)}}
@media(max-height:620px){.end .em{font-size:56px}.q{gap:10px}.foot{padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}.cards{margin:8px 0}}
@media(prefers-reduced-motion:no-preference){
  .bub{animation:bob 1s infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}
  .shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pop{animation:pp .6s}@keyframes pp{50%{transform:scale(1.3) rotate(-8deg)}}
  .q>*{animation:in .25s ease-out both}@keyframes in{from{opacity:0;transform:translateY(8px)}}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<audio id="au" preload="none" playsinline></audio>
<script>
const UNITS=[
{t:"Fe‘llar",d:"Harakat va kundalik ishlar",c:"#58CC02",cd:"#58A700",n:[0,5,10],items:[["идти","piyoda borish"],["ехать","transportda borish"],["кушать / есть","yeyish"],["пить","ichish"],["работать","ishlash"],["учиться","o‘qish"],["спать","uxlash"],["отдыхать","dam olish"],["смотреть","ko‘rish"],["слушать","eshitish"]]},
{t:"Sifatlar",d:"Katta, kichik, issiq, sovuq…",c:"#1CB0F6",cd:"#1899D6",n:[0,5,10],items:[["большой","katta"],["маленький","kichik"],["хороший","yaxshi"],["плохой","yomon"],["дорогой","qimmat"],["дешёвый","arzon"],["вкусный","mazali"],["невкусный","bemazza"],["горячий","issiq"],["холодный","sovuq"]]},
{t:"Iboralar",d:"Holat va his-tuyg‘ular",c:"#CE82FF",cd:"#A560D6",n:[0,6],build:1,items:[["Я устал / Я устала","Men charchadim"],["Я болен / Я больна","Men kasalman"],["Мне интересно","Menga qiziq"],["Мне трудно","Menga qiyin"],["Мне легко","Menga oson"],["Мне хорошо","Menga yaxshi"]]}];
const ALL=UNITS.flatMap(u=>u.items);
const NODES=[];
UNITS.forEach((u,ui)=>{for(let k=0;k<u.n.length-1;k++)NODES.push({id:"n"+NODES.length,ui,it:u.items.slice(u.n[k],u.n[k+1]),pool:u.items,build:u.build,e:"⭐"})});
NODES.push({id:"nx",ui:0,mix:1,pool:ALL,e:"🏆"});

const $=s=>document.querySelector(s),app=$("#app");
let S={xp:0,streak:0,last:"",done:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("duo-ru")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("duo-ru",JSON.stringify(S))}catch(e){}};
const sh=a=>{a=a.slice();for(let i=a.length;i>1;i--){const j=Math.random()*i|0;[a[i-1],a[j]]=[a[j],a[i-1]]}return a};
const f1=r=>r.split(" / ")[0];

/* ---------- Xabar (xatolar jim qolmasin) ---------- */
let tt;
const note=(m,ms=4500)=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),ms)};
const err=(m,e)=>{console.error(m,e||"");note("⚠️ "+m)};

/* ---------- Ovoz tizimi ---------- */
const AU=$("#au");
let ac=null,voice=null,voiceOK=false,tmr=null,U=null,lastGoogleErr=0;
const SIL="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";

// Bitta umumiy AudioContext, har safar qayta yoqiladi
const beep=(f,d=.12)=>{
  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state!=="running")ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;g.gain.value=.07;
    o.connect(g);g.connect(ac.destination);
    o.start();o.stop(ac.currentTime+d);
    o.onended=()=>{try{o.disconnect();g.disconnect()}catch(e){}};
  }catch(e){err("Pik tovushi ishlamadi: "+e.message,e)}
};

const pickVoice=()=>{
  if(!("speechSynthesis"in window))return null;
  const vs=speechSynthesis.getVoices().filter(v=>/^ru/i.test((v.lang||"").replace("_","-")));
  return vs.find(v=>v.localService)||vs[0]||null;
};
// Ovozlar ro'yxati kech yuklanadi, shuning uchun kutamiz (3 soniyagacha)
const loadVoices=()=>new Promise(res=>{
  if(!("speechSynthesis"in window))return res(null);
  voice=pickVoice();if(voice)return res(voice);
  let n=0;
  speechSynthesis.onvoiceschanged=()=>{voice=pickVoice();if(voice){clearInterval(iv);res(voice)}};
  const iv=setInterval(()=>{voice=pickVoice();if(voice||++n>15){clearInterval(iv);res(voice)}},200);
});

// Google ovozi (rus ovozi telefonda bo'lmasa, internet kerak)
const gsay=(txt,r)=>{
  try{
    AU.pause();
    AU.src="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ru&q="+encodeURIComponent(txt);
    AU.playbackRate=r<.7?.7:1;
    const p=AU.play();
    if(p&&p.catch)p.catch(e=>{if(Date.now()-lastGoogleErr>4000){lastGoogleErr=Date.now();err("Rus ovozi chiqmadi. Internetni va media ovozini tekshiring.",e)}});
  }catch(e){err("Google ovozi ishlamadi: "+e.message,e)}
};

const say=(t,r=.85)=>{
  const txt=f1(t);
  if(!voice){gsay(txt,r);return}
  try{
    clearTimeout(tmr);AU.pause();
    speechSynthesis.cancel();
    U=new SpeechSynthesisUtterance(txt); // global o'zgaruvchida saqlanadi, Chrome o'chirib yubormasin
    U.voice=voice;U.lang=voice.lang;U.rate=r;
    U.onerror=e=>{if(e.error==="canceled"||e.error==="interrupted")return;err("Ovoz xatosi ("+e.error+"), Google ovoziga o‘tildi.");voice=null;gsay(txt,r)};
    // cancel() dan keyin darrov speak() Chrome'da gapni tushirib yuboradi
    tmr=setTimeout(()=>{try{speechSynthesis.resume();speechSynthesis.speak(U)}catch(e){err("Ovoz xatosi: "+e.message,e)}},90);
  }catch(e){err("Ovoz xatosi: "+e.message,e);voice=null;gsay(txt,r)}
};

// "Boshlash" bosilganda chaqiriladi: brauzer ovozni ochadi
async function initAudio(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();await ac.resume()}catch(e){err("AudioContext ochilmadi: "+e.message,e)}
  beep(660,.08);
  try{if("speechSynthesis"in window){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}}catch(e){}
  try{AU.src=SIL;const p=AU.play();if(p&&p.catch)await p.catch(()=>{})}catch(e){}
  await loadVoices();
  voiceOK=true;
}

const OFF=[0,40,66,40,0,-40,-66,-40];

/* ---------- Boshlash ekrani ---------- */
function splash(){
  app.innerHTML=`<div class="end st"><div class="em pop">🐫</div><h1>Ruscha o‘rganamiz</h1><p id="stt">Ovoz bilan o‘rganish uchun “Boshlash” tugmasini bosing.</p></div><div class="foot"><button class="btn" id="go0">Boshlash</button></div>`;
  const b=$("#go0");
  b.onclick=async()=>{
    b.disabled=true;b.textContent="Ovoz yuklanmoqda…";
    $("#stt").textContent="Rus ovozi qidirilmoqda…";
    await initAudio();
    if(voice)note("✔ Rus ovozi tayyor: "+voice.name,3000);
    else note("Telefonda rus ovozi yo‘q. Google ovoziga o‘tildi, internet kerak.",6000);
    home();
  };
}

/* ---------- Bosh sahifa ---------- */
function home(){
  const cur=NODES.findIndex(n=>!S.done[n.id]);let gi=0,html="";
  UNITS.forEach((u,ui)=>{
    html+=`<div class="unit" style="background:${u.c};border-color:${u.cd}"><div><small>${ui+1}-BO‘LIM</small><b>${u.t}</b><span>${u.d}</span></div><span class="ic">📖</span></div>`;
    NODES.forEach((n,i)=>{if(n.ui!==ui||n.mix)return;html+=nodeH(n,i,cur,gi++,u)});
  });
  const m=NODES.length-1;
  html+=`<div class="unit" style="background:#FF9600;border-color:#E58700"><div><small>FINAL</small><b>Aralash jang</b><span>Hammasini takrorlang</span></div><span class="ic">🔥</span></div>`+nodeH(NODES[m],m,cur,gi,{c:"#FF9600",cd:"#E58700"});
  app.innerHTML=`<div class="stats"><span class="fl" aria-label="Rus tili"></span><span style="color:var(--o)">🔥 ${S.streak}</span><span style="color:var(--b)">💎 ${S.xp}</span><span style="color:var(--r)">❤️ 5</span></div><div class="home">${html}</div>`;
  app.querySelectorAll(".node").forEach(b=>b.onclick=()=>{
    const n=NODES[b.dataset.i];
    if(b.classList.contains("lock")){b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),400);beep(180)}
    else start(n)});
  const c=$(".node:not(.lock):not(.done)");if(c)c.scrollIntoView({block:"center"});
}
function nodeH(n,i,cur,g,u){
  const st=S.done[n.id]?"done":i===cur?"cur":(i<cur?"done":"lock");
  const sty=st==="cur"?`background:${u.c};border-color:${u.cd}`:"";
  return `<div class="nw" style="transform:translateX(calc(${OFF[g%8]} * var(--u)))">${st==="cur"?'<span class="bub">BOSHLASH</span>':""}<button class="node ${st==="cur"?"":st}" data-i="${i}" style="${sty}" aria-label="Dars ${i+1}">${st==="lock"?"🔒":st==="done"?"✓":n.e}</button></div>`;
}

/* ---------- Dars boshlash ---------- */
let G;
function start(n){
  const items=n.mix?sh(ALL).slice(0,6):n.it;
  // 1) avval so'zlarni o'rgatamiz (aralash jangda yo'q)
  let q=n.mix?[]:items.map((i,x)=>({k:"learn",i,n:x+1,of:items.length}));
  // 2) keyin ruscha -> o'zbekcha savollar
  q=q.concat(sh(items).map(i=>({k:"ru2uz",i,pool:n.pool})));
  // 3) juftlash
  q.push({k:"match",items});
  // 4) aralash mashqlar
  sh(items).forEach(i=>{
    const ks=["uz2ru","listen","ru2uz"];if(n.build)ks.push("build","build");
    q.push({k:ks[Math.random()*ks.length|0],i,pool:n.pool});
  });
  G={n,q,tot:q.length,done:0,hearts:5,ok:0,miss:0,t0:Date.now(),streak:0};
  show();
}
const head=()=>`<div class="head"><button class="x" id="quit" aria-label="Chiqish">✕</button><div class="bar"><i style="width:${G.done/G.tot*100}%"></i></div><span class="hr">❤️ <span id="hr">${G.hearts}</span></span></div>`;

function show(){
  if(G.hearts<=0)return end(false);
  if(!G.q.length)return end(true);
  const q=G.q[0];
  app.innerHTML=head()+`<div class="q" id="q"></div><div class="foot" id="foot"><button class="btn" id="chk" disabled>Tekshirish</button></div>`;
  $("#quit").onclick=home;
  const Q=$("#q");q.get=null;
  if(q.k==="learn")return learnQ(q,Q);
  if(q.k==="match")return matchQ(q,Q);
  if(q.k==="build"){
    const ans=f1(q.i[0]).split(" ");
    const ex=sh(ALL.flatMap(a=>f1(a[0]).split(" "))).filter(w=>!ans.includes(w)).slice(0,2);
    q.tok=sh(ans.concat([...new Set(ex)]));q.sel=[];q.ans=ans.join(" ");
    Q.innerHTML=`<h2>Ruscha yozing</h2><div class="mas"><span class="em">🐫</span><div class="say">${q.i[1]}</div></div><div class="ans" id="ans"></div><div class="bank" id="bank"></div>`;
    tiles(q);q.get=()=>q.sel.join(" ");q.cor=q.ans;return arm(q);
  }
  const cor=q.k==="uz2ru"?q.i[0]:q.i[1];q.cor=cor;
  const wr=sh(q.pool.filter(a=>a!==q.i)).slice(0,3).map(a=>q.k==="uz2ru"?a[0]:a[1]);
  let top;
  if(q.k==="listen")top=`<h2>Eshiting va tarjimasini tanlang</h2><div class="snd"><button class="big" id="sp" aria-label="Eshitish">🔊</button><button class="slow" id="sl" aria-label="Sekin">🐢</button></div>`;
  else if(q.k==="ru2uz")top=`<h2>Bu so‘z nimani anglatadi?</h2><div class="mas"><span class="em">🐫</span><div class="say"><button class="spk" id="sp" aria-label="Eshitish">🔊</button><span style="border-bottom:2px dotted var(--mut)">${q.i[0]}</span></div></div>`;
  else top=`<h2>Ruscha qanday aytiladi?</h2><div class="mas"><span class="em">🐫</span><div class="say">${q.i[1]}</div></div>`;
  const opts=sh([cor,...wr]);
  Q.innerHTML=top+`<div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`;
  let p=null;
  Q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    Q.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");p=opts[+b.dataset.k];$("#chk").disabled=false;
    if(q.k==="uz2ru")say(p);
  });
  q.get=()=>p;
  if($("#sp")){$("#sp").onclick=()=>say(q.i[0]);say(q.i[0])}
  if($("#sl"))$("#sl").onclick=()=>say(q.i[0],.5);
  arm(q);
}

/* ---------- Yangi so'z kartochkasi ---------- */
function learnQ(q,Q){
  const w=q.i;
  Q.innerHTML=`<div class="learn"><span class="chipn">Yangi so‘z ${q.n} / ${q.of}</span><div class="card"><div class="lw">${w[0]}</div><div class="lu">${w[1]}</div></div><div class="snd"><button class="big" id="sp" aria-label="Eshitish">🔊</button><button class="slow" id="sl" aria-label="Sekin">🐢</button></div></div>`;
  $("#sp").onclick=()=>say(w[0]);
  $("#sl").onclick=()=>say(w[0],.5);
  say(w[0]);
  const c=$("#chk");c.disabled=false;c.textContent="Davom etish";
  c.onclick=()=>{G.q.shift();G.done++;beep(660,.08);show()};
}

/* ---------- Tekshirish ---------- */
function arm(q){$("#chk").onclick=()=>{const good=q.get()===q.cor;Q_lock();result(good,q.cor)}}
const Q_lock=()=>app.querySelectorAll("#q .opt,#q .tile").forEach(b=>b.disabled=true);

function tiles(q){
  const A=$("#ans"),B=$("#bank");
  A.innerHTML=q.sel.map((w,i)=>`<button class="tile" data-a="${i}">${w}</button>`).join("");
  const u=[...q.sel],rest=[];
  q.tok.forEach(w=>{const k=u.indexOf(w);k>-1?u.splice(k,1):rest.push(w)});
  B.innerHTML=rest.map(w=>`<button class="tile" data-b="${w}">${w}</button>`).join("");
  $("#chk").disabled=!q.sel.length;
  A.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{q.sel.splice(+t.dataset.a,1);tiles(q)});
  B.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{q.sel.push(t.dataset.b);say(t.dataset.b);tiles(q)});
}

function matchQ(q,Q){
  const L=q.items.map(i=>i[0]),R=sh(q.items.map(i=>i[1])),map={};
  q.items.forEach(i=>map[i[0]]=i[1]);
  const ls=sh(L);
  Q.innerHTML=`<h2>Juftlarni toping</h2><div class="mt"><div>${ls.map((w,k)=>`<button class="tile" data-s="L" data-k="${k}">${w}</button>`).join("")}</div><div>${R.map((w,k)=>`<button class="tile" data-s="R" data-k="${k}">${w}</button>`).join("")}</div></div>`;
  let sel=null,left=L.length;
  $("#chk").style.visibility="hidden";
  const val=b=>(b.dataset.s==="L"?ls:R)[+b.dataset.k];
  Q.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    if(sel&&sel.dataset.s===b.dataset.s){sel.classList.remove("sel");sel=b;b.classList.add("sel");if(b.dataset.s==="L")say(val(b));return}
    if(!sel){sel=b;b.classList.add("sel");if(b.dataset.s==="L")say(val(b));return}
    const l=sel.dataset.s==="L"?sel:b,r=sel.dataset.s==="R"?sel:b,a=sel;sel=null;
    if(map[val(l)]===val(r)){
      [l,r].forEach(x=>{x.classList.remove("sel");x.classList.add("ok");x.disabled=true});
      beep(740);say(val(l));
      if(--left===0)result(true,"");
    }else{
      a.classList.remove("sel");[l,r].forEach(x=>x.classList.add("no"));
      G.hearts--;G.miss++;$("#hr").textContent=G.hearts;beep(180,.2);
      setTimeout(()=>{[l,r].forEach(x=>x.classList.remove("no"));if(G.hearts<=0)end(false)},450);
    }
  });
}

function result(good,ans){
  beep(good?660:180,good?.12:.25);
  if(good){G.ok++;G.done++;G.streak++;G.q.shift();beep(880,.15)}
  else{G.hearts--;G.miss++;G.streak=0;G.q.push(G.q.shift());$("#hr").textContent=G.hearts;app.classList.add("shake");setTimeout(()=>app.classList.remove("shake"),400)}
  $(".bar i").style.width=G.done/G.tot*100+"%";
  const pr=["Ajoyib!","Barakalla!","Zo‘r!","Mukammal!"][Math.random()*4|0];
  const F=$("#foot");F.className="foot "+(good?"ok":"bad");
  F.innerHTML=`<h3>${good?"✔ "+pr:"✖ Noto‘g‘ri"}</h3>${good?(G.streak>2?`<p>🔥 ${G.streak} ta ketma-ket!</p>`:"<p></p>"):`<p>To‘g‘ri javob:<br><b>${ans}</b></p>`}<button class="btn" id="nx">Davom etish</button>`;
  $("#nx").focus();$("#nx").onclick=show;
}

function end(win){
  const sec=Math.round((Date.now()-G.t0)/1000),acc=Math.round(G.ok/(G.ok+G.miss||1)*100);
  if(win){
    const d=new Date().toDateString();
    if(S.last!==d){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=d}
    S.xp+=10+G.ok*2;S.done[G.n.id]=1;save();
  }
  app.innerHTML=win
  ?`<div class="end"><div class="em pop">🐫</div><h1>Dars tugadi!</h1><div class="cards"><div class="cd" style="border-color:var(--y)"><small style="background:var(--y)">JAMI XP</small><b style="color:var(--yd)">⚡ ${10+G.ok*2}</b></div><div class="cd" style="border-color:var(--g)"><small style="background:var(--g)">ANIQLIK</small><b style="color:var(--g)">🎯 ${acc}%</b></div><div class="cd" style="border-color:var(--b)"><small style="background:var(--b)">VAQT</small><b style="color:var(--b)">⏱ ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}</b></div></div><p style="color:var(--o);font-size:20px;margin:0">🔥 ${S.streak} kunlik seriya</p></div><div class="foot"><button class="btn" id="go">Davom etish</button></div>`
  :`<div class="end"><div class="em">💔</div><h1 style="color:var(--r)">Jonlar tugadi!</h1><p>Xafa bo‘lmang, xatolardan o‘rganamiz.</p></div><div class="foot"><button class="btn" id="go">Qayta urinish</button><p></p><button class="btn ghost" id="hm">Chiqish</button></div>`;
  $("#go").onclick=()=>win?home():start(G.n);
  if(!win)$("#hm").onclick=home;else beep(880,.3);
}

document.addEventListener("keydown",e=>{
  if(e.key==="Enter"){const b=$("#nx")||$("#chk")||$("#go0");if(b&&!b.disabled&&b.style.visibility!=="hidden"&&document.activeElement!==b)b.click()}
});
window.addEventListener("error",e=>err("Xato: "+e.message));
splash();
</script>
</body>
</html>
